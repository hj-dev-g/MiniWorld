name: Editor CI

on:
  push:
    branches:
      - feature/reels-editor
    paths:
      - 'editor/**'
      - '.github/workflows/editor-ci.yml'
  pull_request:
    paths:
      - 'editor/**'
      - '.github/workflows/editor-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test timeline and editing state
        run: npm test

      - name: Build
        run: npm run build
